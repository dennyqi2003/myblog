<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>DennyQi's Blog</title>
    <!-- Background and night mode are decided before first paint, so a reader
         who turned the picture off never sees it flash in on the next page. -->
    <script>
      try {
        var root = document.documentElement
        if (localStorage.getItem('bg') === 'off') root.dataset.bg = 'off'
        if (localStorage.getItem('theme') === 'dark') root.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
